<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162035" />
      <stop offset="100%" stop-color="#1e2c4a" />
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#76C0EC" stroke-width="0.6" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#p3Bg)" />
  <rect width="800" height="600" fill="url(#grid3)" />

  <rect x="20" y="20" width="760" height="560" rx="12" fill="none" stroke="#76C0EC" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- Ambient light -->
  <circle cx="650" cy="180" r="170" fill="#76C0EC" fill-opacity="0.1" filter="blur(45px)" />
  <circle cx="200" cy="450" r="140" fill="#FF95A5" fill-opacity="0.08" filter="blur(35px)" />

  <!-- Infographics Composition -->
  <g transform="translate(140, 70)">
    <!-- Main board -->
    <rect x="0" y="0" width="520" height="360" rx="10" fill="#141c2e" stroke="#FFF6DC" stroke-width="1.2" stroke-opacity="0.3" />
    
    <!-- Infographic Flow Nodes -->
    <!-- Node 1 -->
    <rect x="40" y="40" width="120" height="90" rx="6" fill="#425B9A" fill-opacity="0.35" stroke="#76C0EC" stroke-width="1" />
    <circle cx="100" cy="75" r="20" fill="#76C0EC" fill-opacity="0.3" />
    <text x="100" y="80" fill="#FFF6DC" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle">01</text>
    <rect x="55" y="110" width="90" height="6" rx="3" fill="#FFF6DC" fill-opacity="0.6" />

    <!-- Connector arrow -->
    <path d="M 160 85 L 200 85" stroke="#FF95A5" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Node 2 -->
    <rect x="200" y="40" width="120" height="90" rx="6" fill="#425B9A" fill-opacity="0.35" stroke="#FF95A5" stroke-width="1" />
    <circle cx="260" cy="75" r="20" fill="#FF95A5" fill-opacity="0.3" />
    <text x="260" y="80" fill="#FFF6DC" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle">02</text>
    <rect x="215" y="110" width="90" height="6" rx="3" fill="#FFF6DC" fill-opacity="0.6" />

    <!-- Connector arrow -->
    <path d="M 320 85 L 360 85" stroke="#76C0EC" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Node 3 -->
    <rect x="360" y="40" width="120" height="90" rx="6" fill="#425B9A" fill-opacity="0.35" stroke="#76C0EC" stroke-width="1" />
    <circle cx="420" cy="75" r="20" fill="#76C0EC" fill-opacity="0.3" />
    <text x="420" y="80" fill="#FFF6DC" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle">03</text>
    <rect x="375" y="110" width="90" height="6" rx="3" fill="#FFF6DC" fill-opacity="0.6" />

    <!-- Data Chart Simulation -->
    <g transform="translate(40, 160)">
      <rect x="0" y="0" width="440" height="160" rx="6" fill="#1c2742" />
      <!-- Bar heights -->
      <rect x="60" y="80" width="30" height="60" rx="3" fill="#425B9A" />
      <rect x="130" y="50" width="30" height="90" rx="3" fill="#76C0EC" />
      <rect x="200" y="30" width="30" height="110" rx="3" fill="#FF95A5" />
      <rect x="270" y="65" width="30" height="75" rx="3" fill="#76C0EC" />
      <rect x="340" y="40" width="30" height="100" rx="3" fill="#FFF6DC" fill-opacity="0.9" />
      <!-- Axis line -->
      <line x1="40" y1="140" x2="400" y2="140" stroke="#76C0EC" stroke-width="1" stroke-opacity="0.4" />
    </g>
  </g>

  <!-- Editorial Info -->
  <g transform="translate(60, 480)">
    <text x="0" y="0" fill="#FF95A5" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" letter-spacing="3">PROJECT 03 // INFOGRAPHICS</text>
    <text x="0" y="28" fill="#FFF6DC" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="22">إنفوجرافيك وتصميم محتوى تعليمي تفاعلي</text>
    <text x="0" y="52" fill="#76C0EC" font-family="'Outfit', sans-serif" font-weight="400" font-size="13" letter-spacing="1">PROJECT IMAGE PLACEHOLDER // READY TO REPLACE</text>
  </g>
</svg>
