<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2742" />
      <stop offset="40%" stop-color="#233256" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76C0EC" />
      <stop offset="100%" stop-color="#425B9A" />
    </linearGradient>

    <!-- Warm Glow -->
    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF95A5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF95A5" stop-opacity="0" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#76C0EC" stroke-width="0.75" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#heroBgGrad)" rx="24" />
  <rect width="800" height="1000" fill="url(#gridPattern)" rx="24" />

  <!-- Outer Editorial Border -->
  <rect x="24" y="24" width="752" height="952" rx="16" fill="none" stroke="#76C0EC" stroke-width="1" stroke-opacity="0.25" />

  <!-- Crop Marks (Editorial Style) -->
  <g stroke="#FFF6DC" stroke-width="1.5" stroke-opacity="0.6">
    <!-- Top Left -->
    <line x1="16" y1="44" x2="44" y2="44" />
    <line x1="44" y1="16" x2="44" y2="44" />
    <!-- Top Right -->
    <line x1="756" y1="44" x2="784" y2="44" />
    <line x1="756" y1="16" x2="756" y2="44" />
    <!-- Bottom Left -->
    <line x1="16" y1="956" x2="44" y2="956" />
    <line x1="44" y1="956" x2="44" y2="984" />
    <!-- Bottom Right -->
    <line x1="756" y1="956" x2="784" y2="956" />
    <line x1="756" y1="956" x2="756" y2="984" />
  </g>

  <!-- Subtle Ambient Glow -->
  <circle cx="280" cy="380" r="220" fill="url(#pinkGlow)" />
  <circle cx="580" cy="620" r="200" fill="#76C0EC" fill-opacity="0.08" filter="blur(40px)" />

  <!-- Asymmetric Frame Geometry -->
  <rect x="90" y="110" width="620" height="740" rx="12" fill="#425B9A" fill-opacity="0.25" stroke="#76C0EC" stroke-width="1" stroke-dasharray="4 4" />
  <rect x="110" y="130" width="580" height="700" rx="8" fill="#141c2e" fill-opacity="0.7" stroke="#FFF6DC" stroke-width="1" stroke-opacity="0.2" />

  <!-- Abstract Architectural Art Element -->
  <g transform="translate(140, 180)">
    <!-- Elegant Geometric Form -->
    <path d="M 120 420 C 120 240, 240 120, 420 120 L 420 420 Z" fill="url(#accentGrad)" fill-opacity="0.25" />
    <circle cx="260" cy="240" r="140" fill="none" stroke="#FFF6DC" stroke-width="1.5" stroke-opacity="0.3" />
    <circle cx="260" cy="240" r="80" fill="#FF95A5" fill-opacity="0.15" stroke="#FF95A5" stroke-width="1.5" />
    
    <!-- Diagonal Dynamic Ribbon -->
    <line x1="40" y1="460" x2="480" y2="20" stroke="#76C0EC" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="70" y1="470" x2="490" y2="50" stroke="#FF95A5" stroke-width="1" stroke-opacity="0.35" />

    <!-- Visual Identity Monogram Marker -->
    <circle cx="260" cy="240" r="32" fill="#425B9A" stroke="#FFF6DC" stroke-width="2" />
    <text x="260" y="248" fill="#FFF6DC" font-family="'Outfit', 'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="20" text-anchor="middle" letter-spacing="1">HM</text>
  </g>

  <!-- Editorial Typographic Accents -->
  <text x="140" y="90" fill="#FFF6DC" font-family="'Outfit', sans-serif" font-weight="600" font-size="14" letter-spacing="4">PORTFOLIO '26 / ART DIRECTION</text>
  <text x="690" y="90" fill="#76C0EC" font-family="'Outfit', sans-serif" font-weight="400" font-size="13" text-anchor="end" letter-spacing="2">PLATE NO. 01</text>

  <!-- Frame Metadata Callouts -->
  <g transform="translate(140, 770)">
    <text x="0" y="0" fill="#FFF6DC" font-family="'Outfit', sans-serif" font-weight="700" font-size="28" letter-spacing="1">HAGAR MOHAMED</text>
    <text x="0" y="26" fill="#76C0EC" font-family="'Outfit', sans-serif" font-weight="400" font-size="14" letter-spacing="3">VISUAL IDENTITY &amp; GRAPHIC DESIGN</text>
    <text x="0" y="52" fill="#FFF6DC" fill-opacity="0.6" font-family="'Outfit', sans-serif" font-weight="300" font-size="12" letter-spacing="1">REPLACE THIS IMAGE WITH YOUR PORTRAIT OR HERO ARTWORK</text>
  </g>

  <!-- Subtle Pink Accent Dot -->
  <circle cx="670" cy="790" r="6" fill="#FF95A5" />
  <circle cx="670" cy="790" r="14" fill="none" stroke="#FF95A5" stroke-width="1" stroke-opacity="0.5" />

  <!-- Bottom Coordinates -->
  <text x="50" y="940" fill="#FFF6DC" fill-opacity="0.4" font-family="'Outfit', monospace" font-size="11" letter-spacing="2">COORD: 30°02'N 31°14'E</text>
  <text x="750" y="940" fill="#FFF6DC" fill-opacity="0.4" font-family="'Outfit', monospace" font-size="11" text-anchor="end" letter-spacing="2">SCALE 1:1.618</text>
</svg>
