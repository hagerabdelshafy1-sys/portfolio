<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2a4a" />
      <stop offset="60%" stop-color="#2c3c66" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="p1Accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#425B9A" />
      <stop offset="50%" stop-color="#76C0EC" />
      <stop offset="100%" stop-color="#FF95A5" />
    </linearGradient>
    <pattern id="grid1" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#76C0EC" stroke-width="0.7" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#p1Bg)" />
  <rect width="1200" height="800" fill="url(#grid1)" />

  <!-- Outer frame -->
  <rect x="30" y="30" width="1140" height="740" rx="16" fill="none" stroke="#76C0EC" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Ambient Glow -->
  <circle cx="900" cy="300" r="280" fill="#76C0EC" fill-opacity="0.12" filter="blur(60px)" />
  <circle cx="350" cy="550" r="240" fill="#FF95A5" fill-opacity="0.08" filter="blur(50px)" />

  <!-- Compositional Elements -->
  <!-- Editorial layout simulation: Social Cover & Identity Sheets -->
  <g transform="translate(100, 120)">
    <!-- Card 1: Poster Mockup -->
    <rect x="0" y="0" width="420" height="560" rx="12" fill="#141c2e" stroke="#76C0EC" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Poster Inner Art -->
    <rect x="24" y="24" width="372" height="340" rx="8" fill="#425B9A" fill-opacity="0.35" />
    <circle cx="210" cy="180" r="80" fill="#FFF6DC" fill-opacity="0.1" stroke="#FF95A5" stroke-width="2" />
    <circle cx="210" cy="180" r="45" fill="#76C0EC" fill-opacity="0.2" />
    <text x="210" y="188" fill="#FFF6DC" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="22" text-anchor="middle">ثلاثون شهراً</text>
    <!-- Poster Typography Lines -->
    <rect x="40" y="390" width="180" height="14" rx="4" fill="#FFF6DC" fill-opacity="0.85" />
    <rect x="40" y="420" width="300" height="8" rx="4" fill="#76C0EC" fill-opacity="0.5" />
    <rect x="40" y="440" width="260" height="8" rx="4" fill="#76C0EC" fill-opacity="0.3" />
    <rect x="40" y="490" width="100" height="24" rx="6" fill="#FF95A5" fill-opacity="0.9" />
    <text x="90" y="506" fill="#141c2e" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" text-anchor="middle">BRAND GUIDE</text>
  </g>

  <!-- Card 2: Social Media Carousel Mockup (Offset) -->
  <g transform="translate(560, 160)">
    <rect x="0" y="0" width="500" height="360" rx="12" fill="#202d4f" stroke="#FFF6DC" stroke-width="1" stroke-opacity="0.25" />
    <rect x="20" y="20" width="460" height="230" rx="8" fill="#141c2e" />
    <!-- Wave / Organic identity curve -->
    <path d="M 20 180 Q 140 100, 250 160 T 480 120 L 480 250 L 20 250 Z" fill="url(#p1Accent)" fill-opacity="0.3" />
    <text x="250" y="130" fill="#FFF6DC" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" font-size="20" text-anchor="middle">هوية بصرية رقمية متكاملة</text>
    <rect x="30" y="275" width="200" height="10" rx="4" fill="#FFF6DC" fill-opacity="0.7" />
    <rect x="30" y="295" width="320" height="8" rx="4" fill="#76C0EC" fill-opacity="0.4" />
    <!-- Carousel Dots -->
    <circle cx="430" cy="320" r="5" fill="#FF95A5" />
    <circle cx="448" cy="320" r="5" fill="#76C0EC" fill-opacity="0.5" />
    <circle cx="466" cy="320" r="5" fill="#76C0EC" fill-opacity="0.3" />
  </g>

  <!-- Editorial Info Callout -->
  <g transform="translate(560, 560)">
    <text x="0" y="0" fill="#FF95A5" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" letter-spacing="3">FEATURED PROJECT 01</text>
    <text x="0" y="32" fill="#FFF6DC" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="28">برنامج ثلاثون شهراً — هوية بصرية وتصاميم منصات</text>
    <text x="0" y="62" fill="#76C0EC" font-family="'Outfit', sans-serif" font-weight="400" font-size="14" letter-spacing="1">PROJECT IMAGE PLACEHOLDER // READY TO REPLACE</text>
  </g>

  <!-- Corner Tag -->
  <rect x="1000" y="55" width="140" height="34" rx="6" fill="#425B9A" stroke="#76C0EC" stroke-width="1" />
  <text x="1070" y="77" fill="#FFF6DC" font-family="'Outfit', sans-serif" font-weight="600" font-size="12" text-anchor="middle" letter-spacing="1">BEHANCE CASE</text>
</svg>
